<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Video Player</title>
</head>
<body>
    <div class="container">
        <div class="header">| Video Player | Created By R@TUL |</div>
        <div class="display">
            <video src="" id="target" ></video>
        </div>
        <div class="footer">
            <label for="file" class="btn">Choose Video 
                <input type="file" name="" id="file" accept="video/.mp4" >
            </label>
            <button type="button" class="btn">Play</button>
            <button type="button" class="btn">Pause</button>
        </div>
    </div>
<script src="script.js" type="text/javascript"></script>
</body>
</html>
